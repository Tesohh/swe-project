# NOTE: This is a docker-compose for local development!!!
# The real docker-compose is on the server as that requires special server-specific configuration and credentials

services:
    caddy:
        image: caddy:2.11.3-alpine
        restart: unless-stopped
        ports:
            - "8080:80"
            - "8443:443"
        volumes:
            - ./Caddyfile.dev:/etc/caddy/Caddyfile:z,ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - app
        depends_on:
            - frontend
            - postgres
            - auth
            - songs
            - queues

    frontend:
        restart: unless-stopped
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        volumes:
            - ./frontend/src:/app/src:z,ro
        expose:
            - "5173"
        networks:
            - app
        env_file:
            - .env

    auth:
        restart: unless-stopped
        build:
            context: .
            dockerfile: auth/Dockerfile.dev
        volumes:
            - ./auth/src:/srv/auth/src:z,ro
            - ./auth/pyproject.toml:/srv/auth/pyproject.toml:z,ro
            - ./auth/uv.lock:/srv/auth/uv.lock:z,ro
            - ./common/src:/srv/common/src:z,ro
        environment:
            - DATABASE_URL=postgresql://root:root@postgres:5432/auth
            - DEPLOYMENT_ENV=development
            - JWT_SECRET_KEY=${JWT_SECRET_KEY:-KABASHISTYLE}
            - QUEUES_BASE=http://queues:8000
        expose:
            - "8000"
        networks:
            - app
        depends_on:
            postgres:
                condition: service_healthy

    songs:
        restart: unless-stopped
        build:
            context: .
            dockerfile: songs/Dockerfile.dev
        volumes:
            - ./songs/src:/srv/songs/src:z,ro
            - ./songs/pyproject.toml:/srv/songs/pyproject.toml:z,ro
            - ./songs/uv.lock:/srv/songs/uv.lock:z,ro
            - ./common/src:/srv/common/src:z,ro
            - ./.data/songs:/srv/songs/songs:z
        environment:
            - DATABASE_URL=postgresql://root:root@postgres:5432/songs
            - DEPLOYMENT_ENV=development
            - JWT_SECRET_KEY=${JWT_SECRET_KEY:-KABASHISTYLE}
            - INFERENCE_TAGGER_BASE=http://inference:8000
        expose:
            - "8000"
        networks:
            - app
        depends_on:
            postgres:
                condition: service_healthy

    queues:
        restart: unless-stopped
        build:
            context: .
            dockerfile: queues/Dockerfile.dev
        volumes:
            - ./queues/src:/srv/queues/src:z,ro
            - ./queues/pyproject.toml:/srv/queues/pyproject.toml:z,ro
            - ./queues/uv.lock:/srv/queues/uv.lock:z,ro
            - ./common/src:/srv/common/src:z,ro
        environment:
            - DATABASE_URL=postgresql://root:root@postgres:5432/queues
            - DEPLOYMENT_ENV=development
            - JWT_SECRET_KEY=${JWT_SECRET_KEY:-KABASHISTYLE}
            - SONGS_BASE=http://songs:8000
            - AUTH_BASE=http://auth:8000
        expose:
            - "8000"
        networks:
            - app
        depends_on:
            postgres:
                condition: service_healthy

    inference:
        restart: unless-stopped
        build:
            context: ./inference
            dockerfile: Dockerfile.dev
        volumes:
            - ./inference/src:/app/src:z,ro
            - ./inference/pyproject.toml:/app/pyproject.toml:z,ro
            - ./inference/uv.lock:/app/uv.lock:z,ro
        expose:
            - "8000"
        networks:
            - app

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=root
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:z,ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U root"]
            interval: 3s
            timeout: 3s
            retries: 20
        networks:
            - app

    adminer:
        image: adminer:5.4.2
        restart: always
        expose:
            - "8080"
        depends_on:
            - postgres
        networks:
            - app

networks:
    app:
        driver: bridge

volumes:
    caddy_data:
    caddy_config:
    postgres_data:
