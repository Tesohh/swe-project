[project]
name = "inference"
version = "0.1.0"
description = "Music tagger inference: genre, mood, energy, embedding"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "huggingface-hub>=0.30",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "python-multipart>=0.0.20",
    "safetensors>=0.5",
    "soundfile>=0.14.0",
    "transformers>=4.57",
]

[project.optional-dependencies]
cpu = ["torch>=2.9"]
cuda = ["torch>=2.9"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.fastapi]
entrypoint = "src.main:app"
