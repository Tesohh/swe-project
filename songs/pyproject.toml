[project]
name = "songs"
version = "0.1.0"
description = "Song catalog, yt-dlp downloads and audio streaming"
requires-python = ">=3.14"
dependencies = [
    "common",
    "fastapi[standard]==0.136.1",
    "psycopg2-binary==2.9.12",
    "sqlmodel==0.0.38",
    "yt-dlp>=2026.8.19",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.fastapi]
entrypoint = "src.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
