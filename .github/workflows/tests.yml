name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [common, auth, songs, queues, inference, ml]
    services:
      # only auth, songs and queues use it. Each test run makes its own <service>_test database
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # inference: also run the test that downloads the AST feature extractor
      RUN_HF_TESTS: "1"
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock

      - name: Install
        run: uv sync --locked --dev

      - name: Test
        run: uv run pytest -q
