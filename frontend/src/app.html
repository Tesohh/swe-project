<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Apply saved theme before first paint to avoid white flash in dark mode -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem("mode-watcher-mode") ?? "system";
					var light = mode === "light" || (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
					document.documentElement.classList.toggle("dark", !light);
					document.documentElement.style.colorScheme = light ? "light" : "dark";
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
