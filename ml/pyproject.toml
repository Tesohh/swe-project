[project]
name = "ml"
version = "0.1.0"
description = "Dataset tooling for the music model"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
dataset-check = "ml.dataset.cli:main"
dataset-collect = "ml.dataset.collect:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[tool.uv.build-backend]
module-name = "ml"
