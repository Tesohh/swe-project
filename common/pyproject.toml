[project]
name = "common"
version = "0.1.0"
description = "Code shared by the services: JWT check, password hashing, HTTP client to other services"
requires-python = ">=3.14"
dependencies = [
    "bcrypt==4.3.0",
    "fastapi[standard]==0.136.1",
    "httpx>=0.28",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.5.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "common"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
